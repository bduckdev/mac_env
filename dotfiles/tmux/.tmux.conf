unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
bind r source-file ~/.tmux.conf

set -g focus-events on
set -g status-style bg=default
set -g status-left-length 99
set -g status-right-length 99
set -g status-justify absolute-centre


set -g allow-passthrough on
set -g repeat-time 150
set -g base-index 3
set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u

setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
#bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'

bind-key -n C-g display-popup -E -d '#{pane_current_path}' -w 80% -h 80% "lazygit"
unbind t
bind t display-popup -E -w 80% -h 80% "$SHELL -f"
#bind f display-popup -E -w 80% -h 80% "$SHELL -f SESSION=$(tmux ls -F '#{session_name}' | fzf); tmux switch-client -t '$SESSION'"

set -g default-terminal "tmux-256color"


#set -g status-justify centre
#set-option -g status-left "[#S] "
#set-option -g status-right "#S"

#set-option -g status-left-length 100

#set -g status-bg DarkCyan
#set -g pane-active-border-style fg=DarkCyan
#set -g pane-border-style fg=Black

#set -g status-position top


bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

bind-key -r C-h swap-pane -s '{left-of}'
bind-key -r C-j swap-pane -s '{down-of}'
bind-key -r C-k swap-pane -s '{up-of}'
bind-key -r C-l swap-pane -s '{right-of}'

bind-key -r H resize-pane -L 20
bind-key -r J resize-pane -D 10
bind-key -r K resize-pane -U 10
bind-key -r L resize-pane -R 20

# Configure the catppuccin plugin
set -g @catppuccin_flavor "cyberdream"
set -g @catppuccin_window_status_style "basic"

# Load catppuccin
run ~/.tmux/plugins/tmux/catppuccin.tmux

setw -g automatic-rename off
setw -g allow-rename off

# Make the status line pretty and add some modules
#set -gF window-status-format         " #I #W "
#set -gF window-status-current-format " #I #W "
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_status_left_separator "█"
set -g status-left "#{E:@catppuccin_status_session}"
#set -ag status-left '#(cat #{socket_path}-\#{session_id}-vimbridge)'
set -g status-right "#{E:@catppuccin_status_application}"
#set -agF status-right "#{E:@catppuccin_status_cpu}"
#set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
#set -agF status-right "#{E:@catppuccin_status_battery}"

# Plugins (managed by TPM — installed via the `tpm` ansible role)
# Add more with: set -g @plugin '<owner>/<repo>', then prefix + I to install

set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jimeh/tmuxifier'
set -g @plugin 'tmux-plugins/tpm'

# Initialize TPM — keep this line at the very bottom of the config
run '~/.tmux/plugins/tpm/tpm'

