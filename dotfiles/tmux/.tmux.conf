set -g default-shell /home/linuxbrew/.linuxbrew/bin/zsh
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
bind r source-file ~/.tmux.conf


set -g allow-passthrough on
set -g repeat-time 1000
set -g base-index 3
set -g mouse on

setw -g mode-keys vi
#bind -T copy-mode-vi v send-keys -X begin-selection
#bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

set -g default-terminal "tmux-256color"



#set -g status-justify centre
#set-option -g status-left "[#S] "
#set-option -g status-right "#S"

#set-option -g status-left-length 100

#   set -g status-bg DarkCyan
#   set -g pane-active-border-style fg=DarkCyan
#   set -g pane-border-style fg=Black

#set -g status-position top


bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key -r C-h swap-pane -s '{left-of}'
bind-key -r C-j swap-pane -s '{down-of}'
bind-key -r C-k swap-pane -s '{up-of}'
bind-key -r C-l swap-pane -s '{right-of}'

bind-key -r H resize-pane -L 20
bind-key -r J resize-pane -D 10
bind-key -r K resize-pane -U 10
bind-key -r L resize-pane -R 20

# Configure the catppuccin plugin
set -g @catppuccin_flavor "cyberdream"
set -g @catppuccin_window_status_style "rounded"

# Load catppuccin
#run ~/.tmux/plugins/tmux/catppuccin.tmux
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

setw -g automatic-rename off
setw -g allow-rename off

# Make the status line pretty and add some modules
#set -gF window-status-format         " #I #W "
#set -gF window-status-current-format " #I #W "
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
#set -agF status-right "#{E:@catppuccin_status_cpu}"
#set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
#set -agF status-right "#{E:@catppuccin_status_battery}"

# Plugins (managed by TPM — installed via the `tpm` ansible role)
# Add more with: set -g @plugin '<owner>/<repo>', then prefix + I to install

set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'jimeh/tmuxifier'
set -g @plugin 'tmux-plugins/tpm'

# Initialize TPM — keep this line at the very bottom of the config
run '~/.tmux/plugins/tpm/tpm'

