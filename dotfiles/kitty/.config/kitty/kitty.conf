include themes/cyberdream.conf

# ── Font ──────────────────────────────────────────────────────────────
font_family         JetBrains Mono
font_size           14.0
line_height         1.15

# ── Performance ───────────────────────────────────────────────────────
# WezTerm max_fps = 165 → kitty uses repaint_delay in ms
# 6ms ≈ 165fps (kitty default is 10ms / ~100fps)
repaint_delay       6

# ── Window decorations ────────────────────────────────────────────────
# WezTerm "RESIZE" = no titlebar, keep resize handles
# On macOS this hides the titlebar; on Linux it hides all decorations
hide_window_decorations  titlebar

# ── Tab bar ───────────────────────────────────────────────────────────
# WezTerm enable_tab_bar = false  → hide tab bar with only one tab
tab_bar_min_tabs       2
tab_bar_edge           bottom
tab_bar_style          separator

# ── Mouse ─────────────────────────────────────────────────────────────
# WezTerm hide_mouse_cursor_when_typing = true
# Kitty hides cursor after N seconds of inactivity (closest equivalent)
mouse_hide_wait       3.0

# ── Window / opacity ──────────────────────────────────────────────────
background_opacity      0.75
background_blur         10
confirm_os_window_close 0

# window_padding: left=16, top=24, right=16, bottom=12
# kitty four-value order is: left, top, right, bottom
window_padding_width   16 24 16 12

shell /home/linuxbrew/.linuxbrew/bin/zsh
