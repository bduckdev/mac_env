# Repo-local Herdr layout for this dotfiles workspace.
# Sessionizer and herdr-project use this whenever mac_env must be recreated.

[layout]
focus = "editor"

# Tabs open in declaration order: _, _, editor, agent, server.
[tabs.one]
label = "_"

[[tabs.one.panes]]

[tabs.two]
label = "_"

[[tabs.two.panes]]

[tabs.editor]
label = "editor"

[[tabs.editor.panes]]
id = "editor"
title = "neovim"
command = "nvim"

[tabs.agent]
label = "agent"

[[tabs.agent.panes]]
id = "agent"
title = "claude code"
command = "claude"

[tabs.server]
label = "server"

[[tabs.server.panes]]
id = "server"
title = "server"
command = "grep -qE '^dev *:' Makefile 2>/dev/null && make dev"
